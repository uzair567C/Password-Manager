# =====================================================
# Log4j2 Configuration
# =====================================================

# Root logger
name=PropertiesConfig
appenders=console, file

# Console Appender
appender.console.type=Console
appender.console.name=console
appender.console.layout.type=PatternLayout
appender.console.layout.pattern=%d{HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n

# File Appender
appender.file.type=File
appender.file.name=file
appender.file.fileName=./logs/application.log
appender.file.layout.type=PatternLayout
appender.file.layout.pattern=%d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n
appender.file.append=true

# Rolling File Appender
appender.rolling.type=RollingFile
appender.rolling.name=rolling
appender.rolling.fileName=./logs/application.log
appender.rolling.filePattern=./logs/application-%d{yyyy-MM-dd}.log.gz
appender.rolling.layout.type=PatternLayout
appender.rolling.layout.pattern=%d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n
appender.rolling.policies.type=Policies
appender.rolling.policies.time.type=TimeBasedTriggeringPolicy
appender.rolling.policies.time.interval=1
appender.rolling.policies.time.modulate=true
appender.rolling.policies.size.type=SizeBasedTriggeringPolicy
appender.rolling.policies.size.size=10MB

# Logger configuration
rootLogger.level=info
rootLogger.appenderRefs=console, rolling
rootLogger.appenderRef.console.ref=console
rootLogger.appenderRef.rolling.ref=rolling

# Application specific loggers
logger.app.name=com.recipe
logger.app.level=debug
logger.app.appenderRefs=rolling
logger.app.appenderRef.rolling.ref=rolling

# Database logger
logger.db.name=com.recipe.database
logger.db.level=debug
logger.db.appenderRefs=rolling
logger.db.appenderRef.rolling.ref=rolling

# Service logger
logger.service.name=com.recipe.services
logger.service.level=debug
logger.service.appenderRefs=rolling
logger.service.appenderRef.rolling.ref=rolling

# GUI logger
logger.gui.name=com.recipe.gui
logger.gui.level=info
logger.gui.appenderRefs=rolling
logger.gui.appenderRef.rolling.ref=rolling