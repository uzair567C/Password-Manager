# =====================================================
# Java Util Logging Configuration
# =====================================================

# Global logging level
.level=INFO

# Console handler
handlers=java.util.logging.ConsoleHandler, java.util.logging.FileHandler

# Console handler configuration
java.util.logging.ConsoleHandler.level=INFO
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter

# File handler configuration
java.util.logging.FileHandler.level=ALL
java.util.logging.FileHandler.pattern=./logs/recipe_%u.log
java.util.logging.FileHandler.limit=10485760
java.util.logging.FileHandler.count=5
java.util.logging.FileHandler.formatter=java.util.logging.SimpleFormatter
java.util.logging.FileHandler.append=true

# Simple formatter format
java.util.logging.SimpleFormatter.format=%1$tY-%1$tm-%1$td %1$tH:%1$tM:%1$tS %4$-6s %2$s - %5$s%6$s%n

# Application specific log levels
com.recipe.level=INFO
com.recipe.database.level=FINE
com.recipe.services.level=FINE
com.recipe.gui.level=INFO
com.recipe.auth.level=INFO
com.recipe.dao.level=FINE

# Third party log levels
org.postgresql.level=WARNING
com.zaxxer.hikari.level=WARNING