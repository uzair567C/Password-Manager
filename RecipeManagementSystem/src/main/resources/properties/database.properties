# =====================================================
# Database Connection Properties
# =====================================================

# PostgreSQL Connection
db.driver=org.postgresql.Driver
db.url=jdbc:postgresql://localhost:5432/recipe_management
db.username=postgres
db.password=your_password_here

# Connection Pool Settings
db.pool.maximumPoolSize=10
db.pool.minimumIdle=2
db.pool.connectionTimeout=30000
db.pool.idleTimeout=600000
db.pool.maxLifetime=1800000
db.pool.leakDetectionThreshold=60000

# Performance Settings
db.pool.cachePrepStmts=true
db.pool.prepStmtCacheSize=250
db.pool.prepStmtCacheSqlLimit=2048

# SSL Settings (for production)
db.ssl=false
db.ssl.mode=disable

# Timeout Settings
db.loginTimeout=10
db.connectTimeout=30
db.socketTimeout=60

# Schema Settings
db.schema=public
db.defaultCatalog=recipe_management