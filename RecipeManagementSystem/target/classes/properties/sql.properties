# =====================================================
# SQL Queries Properties
# =====================================================

# User Queries
sql.user.insert=INSERT INTO users (username, email, password_hash, full_name, calorie_goal) VALUES (?, ?, ?, ?, ?) RETURNING id, created_at
sql.user.select.by.username=SELECT * FROM users WHERE username = ?
sql.user.select.by.email=SELECT * FROM users WHERE email = ?
sql.user.select.by.id=SELECT * FROM users WHERE id = ?
sql.user.update.profile=UPDATE users SET email = ?, full_name = ?, calorie_goal = ? WHERE id = ?
sql.user.update.password=UPDATE users SET password_hash = ? WHERE id = ?
sql.user.update.last.login=UPDATE users SET last_login = CURRENT_TIMESTAMP WHERE id = ?
sql.user.update.stats=UPDATE users SET total_recipes = total_recipes + ?, total_cook_count = total_cook_count + ? WHERE id = ?
sql.user.select.all=SELECT * FROM users ORDER BY username
sql.user.delete=DELETE FROM users WHERE id = ?
sql.user.exists.username=SELECT 1 FROM users WHERE username = ?
sql.user.exists.email=SELECT 1 FROM users WHERE email = ?
sql.user.get.theme=SELECT theme_preference FROM users WHERE id = ?
sql.user.update.theme=UPDATE users SET theme_preference = ? WHERE id = ?

# Recipe Queries
sql.recipe.insert=INSERT INTO recipes (user_id, title, description, prep_time, cook_time, servings, difficulty, category_id, photo_path, cost, is_draft) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?) RETURNING id, created_at, updated_at
sql.recipe.update=UPDATE recipes SET title = ?, description = ?, prep_time = ?, cook_time = ?, servings = ?, difficulty = ?, category_id = ?, photo_path = ?, cost = ?, is_draft = ?, updated_at = CURRENT_TIMESTAMP WHERE id = ?
sql.recipe.select.by.id=SELECT r.*, COALESCE(AVG(rat.stars), 0) as avg_rating FROM recipes r LEFT JOIN ratings rat ON r.id = rat.recipe_id WHERE r.id = ? GROUP BY r.id
sql.recipe.select.all=SELECT r.*, COALESCE(AVG(rat.stars), 0) as avg_rating FROM recipes r LEFT JOIN ratings rat ON r.id = rat.recipe_id WHERE r.is_draft = false GROUP BY r.id ORDER BY r.created_at DESC
sql.recipe.select.by.user=SELECT r.*, COALESCE(AVG(rat.stars), 0) as avg_rating FROM recipes r LEFT JOIN ratings rat ON r.id = rat.recipe_id WHERE r.user_id = ? GROUP BY r.id ORDER BY r.created_at DESC
sql.recipe.delete=DELETE FROM recipes WHERE id = ?
sql.recipe.increment.cook=UPDATE recipes SET cook_count = cook_count + 1, updated_at = CURRENT_TIMESTAMP WHERE id = ?
sql.recipe.search.by.title=SELECT r.*, COALESCE(AVG(rat.stars), 0) as avg_rating FROM recipes r LEFT JOIN ratings rat ON r.id = rat.recipe_id WHERE r.title ILIKE ? AND r.is_draft = false GROUP BY r.id ORDER BY r.created_at DESC

# Ingredient Queries
sql.ingredient.select.all=SELECT * FROM ingredients ORDER BY name
sql.ingredient.select.by.id=SELECT * FROM ingredients WHERE id = ?
sql.ingredient.select.by.name=SELECT * FROM ingredients WHERE name ILIKE ?
sql.ingredient.insert=INSERT INTO ingredients (name, unit, unit_price, calories_per_unit, protein_per_unit, carbs_per_unit, fat_per_unit) VALUES (?, ?, ?, ?, ?, ?, ?) RETURNING id
sql.ingredient.update=UPDATE ingredients SET name = ?, unit = ?, unit_price = ?, calories_per_unit = ?, protein_per_unit = ?, carbs_per_unit = ?, fat_per_unit = ? WHERE id = ?
sql.ingredient.delete=DELETE FROM ingredients WHERE id = ?
sql.ingredient.search=SELECT * FROM ingredients WHERE name ILIKE ? LIMIT 20

# Recipe Ingredients Queries
sql.recipe.ingredient.insert=INSERT INTO recipe_ingredients (recipe_id, ingredient_id, quantity, unit, notes) VALUES (?, ?, ?, ?, ?)
sql.recipe.ingredient.delete=DELETE FROM recipe_ingredients WHERE recipe_id = ?
sql.recipe.ingredient.select=SELECT ri.*, i.name, i.unit as ingredient_unit, i.unit_price, i.calories_per_unit, i.protein_per_unit, i.carbs_per_unit, i.fat_per_unit FROM recipe_ingredients ri JOIN ingredients i ON ri.ingredient_id = i.id WHERE ri.recipe_id = ?

# Nutrition Queries
sql.nutrition.select=SELECT * FROM nutrition WHERE recipe_id = ?
sql.nutrition.insert=INSERT INTO nutrition (recipe_id, calories, protein, carbs, fat, fiber, sugar, sodium) VALUES (?, ?, ?, ?, ?, ?, ?, ?) ON CONFLICT (recipe_id) DO UPDATE SET calories = EXCLUDED.calories, protein = EXCLUDED.protein, carbs = EXCLUDED.carbs, fat = EXCLUDED.fat, fiber = EXCLUDED.fiber, sugar = EXCLUDED.sugar, sodium = EXCLUDED.sodium
sql.nutrition.delete=DELETE FROM nutrition WHERE recipe_id = ?

# Meal Plan Queries
sql.mealplan.insert=INSERT INTO meal_plans (user_id, recipe_id, day_of_week, meal_type, week_start) VALUES (?, ?, ?, ?, ?) ON CONFLICT (user_id, day_of_week, meal_type, week_start) DO UPDATE SET recipe_id = EXCLUDED.recipe_id RETURNING id
sql.mealplan.delete=DELETE FROM meal_plans WHERE user_id = ? AND day_of_week = ? AND meal_type = ? AND week_start = ?
sql.mealplan.select.week=SELECT mp.*, r.title as recipe_title, r.photo_path as recipe_photo_path FROM meal_plans mp JOIN recipes r ON mp.recipe_id = r.id WHERE mp.user_id = ? AND mp.week_start = ? ORDER BY mp.day_of_week, CASE mp.meal_type WHEN 'Breakfast' THEN 1 WHEN 'Lunch' THEN 2 WHEN 'Dinner' THEN 3 WHEN 'Snack' THEN 4 END
sql.mealplan.delete.week=DELETE FROM meal_plans WHERE user_id = ? AND week_start = ?
sql.mealplan.select.planned.recipes=SELECT DISTINCT mp.recipe_id, r.title, r.servings FROM meal_plans mp JOIN recipes r ON mp.recipe_id = r.id WHERE mp.user_id = ? AND mp.week_start = ?

# Rating Queries
sql.rating.insert=INSERT INTO ratings (user_id, recipe_id, stars, review_text) VALUES (?, ?, ?, ?) ON CONFLICT (user_id, recipe_id) DO UPDATE SET stars = EXCLUDED.stars, review_text = EXCLUDED.review_text, created_at = CURRENT_TIMESTAMP RETURNING id, created_at
sql.rating.select.by.recipe=SELECT r.*, u.username FROM ratings r JOIN users u ON r.user_id = u.id WHERE r.recipe_id = ? ORDER BY r.created_at DESC
sql.rating.select.by.user=SELECT r.*, u.username FROM ratings r JOIN users u ON r.user_id = u.id WHERE r.user_id = ? ORDER BY r.created_at DESC
sql.rating.select.average=SELECT COALESCE(AVG(stars), 0) as avg_rating, COUNT(*) as rating_count FROM ratings WHERE recipe_id = ?
sql.rating.select.user.rating=SELECT * FROM ratings WHERE user_id = ? AND recipe_id = ?
sql.rating.delete=DELETE FROM ratings WHERE id = ?
sql.rating.delete.by.recipe=DELETE FROM ratings WHERE recipe_id = ?

# Favourite Queries
sql.favourite.insert=INSERT INTO favourites (user_id, recipe_id) VALUES (?, ?) ON CONFLICT (user_id, recipe_id) DO NOTHING
sql.favourite.delete=DELETE FROM favourites WHERE user_id = ? AND recipe_id = ?
sql.favourite.exists=SELECT 1 FROM favourites WHERE user_id = ? AND recipe_id = ?
sql.favourite.select.user=SELECT recipe_id FROM favourites WHERE user_id = ?
sql.favourite.count=SELECT COUNT(*) FROM favourites WHERE recipe_id = ?

# Search Queries
sql.search.filters=SELECT DISTINCT r.*, COALESCE(AVG(rat.stars), 0) as avg_rating FROM recipes r LEFT JOIN ratings rat ON r.id = rat.recipe_id LEFT JOIN nutrition n ON r.id = n.recipe_id LEFT JOIN recipe_ingredients ri ON r.id = ri.recipe_id LEFT JOIN ingredients i ON ri.ingredient_id = i.id WHERE r.is_draft = false
sql.search.by.ingredients=SELECT r.*, COALESCE(AVG(rat.stars), 0) as avg_rating, COUNT(DISTINCT i.id) as matching_ingredients FROM recipes r LEFT JOIN ratings rat ON r.id = rat.recipe_id LEFT JOIN recipe_ingredients ri ON r.id = ri.recipe_id LEFT JOIN ingredients i ON ri.ingredient_id = i.id WHERE r.is_draft = false AND i.name ILIKE ANY(?) GROUP BY r.id
sql.favourite.recipes=SELECT r.*, COALESCE(AVG(rat.stars), 0) as avg_rating FROM recipes r JOIN favourites f ON r.id = f.recipe_id LEFT JOIN ratings rat ON r.id = rat.recipe_id WHERE f.user_id = ? AND r.is_draft = false GROUP BY r.id ORDER BY f.created_at DESC
sql.top.rated.recipes=SELECT r.*, COALESCE(AVG(rat.stars), 0) as avg_rating FROM recipes r LEFT JOIN ratings rat ON r.id = rat.recipe_id WHERE r.is_draft = false GROUP BY r.id HAVING COUNT(rat.id) > 0 ORDER BY avg_rating DESC, COUNT(rat.id) DESC LIMIT ?
sql.most.cooked.recipes=SELECT r.*, COALESCE(AVG(rat.stars), 0) as avg_rating FROM recipes r LEFT JOIN ratings rat ON r.id = rat.recipe_id WHERE r.is_draft = false AND r.cook_count > 0 GROUP BY r.id ORDER BY r.cook_count DESC LIMIT ?

# Category Queries
sql.category.select.all=SELECT * FROM categories ORDER BY type, name
sql.category.select.by.type=SELECT * FROM categories WHERE type = ? ORDER BY name
sql.category.insert=INSERT INTO categories (name, type, icon) VALUES (?, ?, ?) RETURNING id
sql.category.update=UPDATE categories SET name = ?, type = ?, icon = ? WHERE id = ?
sql.category.delete=DELETE FROM categories WHERE id = ?

# Audit Log Queries
sql.audit.insert=INSERT INTO audit_log (user_id, action, entity_type, entity_id, details, ip_address) VALUES (?, ?, ?, ?, ?::jsonb, ?) RETURNING id
sql.audit.select.by.user=SELECT * FROM audit_log WHERE user_id = ? ORDER BY created_at DESC LIMIT ?
sql.audit.select.by.action=SELECT * FROM audit_log WHERE action = ? ORDER BY created_at DESC LIMIT ?
sql.audit.select.recent=SELECT * FROM audit_log ORDER BY created_at DESC LIMIT ?