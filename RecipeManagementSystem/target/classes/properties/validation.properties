# =====================================================
# Validation Rules Configuration
# =====================================================

# User Validation
validation.user.username.min=3
validation.user.username.max=30
validation.user.username.pattern=^[a-zA-Z0-9_]+$
validation.user.password.min=8
validation.user.password.max=50
validation.user.email.pattern=^[A-Za-z0-9+_.-]+@(.+)$

# Recipe Validation
validation.recipe.title.min=1
validation.recipe.title.max=200
validation.recipe.description.max=5000
validation.recipe.prepTime.min=0
validation.recipe.prepTime.max=480
validation.recipe.cookTime.min=0
validation.recipe.cookTime.max=480
validation.recipe.servings.min=1
validation.recipe.servings.max=50
validation.recipe.ingredients.min=1
validation.recipe.ingredients.max=50

# Nutrition Validation
validation.nutrition.calories.min=0
validation.nutrition.calories.max=10000
validation.nutrition.protein.min=0
validation.nutrition.protein.max=500
validation.nutrition.carbs.min=0
validation.nutrition.carbs.max=500
validation.nutrition.fat.min=0
validation.nutrition.fat.max=500

# Cost Validation
validation.cost.min=0
validation.cost.max=10000
validation.cost.selling.min=0
validation.cost.selling.max=50000

# Search Validation
validation.search.term.min=2
validation.search.term.max=100
validation.search.results.max=100