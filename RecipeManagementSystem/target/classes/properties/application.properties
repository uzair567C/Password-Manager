# =====================================================
# Recipe Management System - Application Properties
# =====================================================

# Application Configuration
app.name=Recipe Management System
app.version=2.0
app.developers=Bilal, Ahmad, Uzair, Raja

# Database Configuration
db.host=localhost
db.port=5432
db.name=recipe_management
db.username=postgres
db.password=your_password_here
db.pool.size=10
db.pool.min.idle=2
db.pool.timeout=30000

# File Paths
app.export.path=./exports/
app.images.path=./src/main/resources/images/
app.temp.path=./temp/

# Theme Settings
app.theme.default=light
app.theme.allow.dark=true

# Recipe Settings
recipe.default.servings=4
recipe.max.ingredients=50
recipe.max.instructions=50
recipe.max.title.length=200
recipe.max.description.length=5000

# Meal Plan Settings
mealplan.week.start=MONDAY
mealplan.max.meals.per.day=4

# Nutrition Settings
nutrition.default.calorie.goal=2000
nutrition.max.calories.per.meal=1500

# Export Settings
export.pdf.enabled=true
export.pdf.page.size=LETTER
export.json.enabled=true

# Notification Settings
notification.toast.duration=3000
notification.toast.position=BOTTOM_CENTER

# Search Settings
search.results.per.page=20
search.enable.fuzzy=true

# Logging
logging.level=INFO
logging.file=./logs/application.log
logging.max.size=10MB

# Backup Settings
backup.enabled=true
backup.frequency=DAILY
backup.retention.days=30